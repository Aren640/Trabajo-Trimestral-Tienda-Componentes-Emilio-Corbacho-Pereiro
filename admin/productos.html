<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear producto | VEXORA</title>
    <link rel="icon" type="image/svg+xml" href="../img/vexora_v_orbital.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg py-3" data-bs-theme="dark" aria-label="Navegacion principal">
            <div class="container">
                <a class="navbar-brand fs-4 fw-bold d-flex align-items-center gap-2" href="../index.html" aria-label="VEXORA, inicio">
                    <img src="../img/vexora_v_orbital.svg" alt="" width="50" height="40">
                    <span>VEX<span class="texto-acento">ORA</span></span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar u ocultar menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav mx-lg-auto gap-lg-3 mb-3 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="../tienda.html">Tienda</a></li>
                        <li class="nav-item"><a class="nav-link" href="../contacto.html">Contacto</a></li>
                    </ul>
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <a class="btn btn-primary" href="../cuenta.html">Mi perfil</a>
                        <a class="btn btn-outline-light d-none" id="botonAdmin" href="index.html">Panel Administrador</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4 flex-grow-1">
        <h1 class="h2 mb-4">Crear producto</h1>
        <p class="alert alert-secondary" id="mensajeAdmin" role="status">Comprobando acceso...</p>
        <div class="card d-none mb-3" id="contenidoAdmin">
            <div class="card-body">
                <form id="formularioProducto">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="nombreProducto">Nombre</label>
                            <input class="form-control" id="nombreProducto" name="nombre" type="text" maxlength="120" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="precioProducto">Precio en euros</label>
                            <input class="form-control" id="precioProducto" name="precio" type="number" min="0.01" max="999999.99" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="stockProducto">Stock</label>
                            <input class="form-control" id="stockProducto" name="stock" type="number" min="0" max="1000000" step="1" value="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="categoriaProducto">Categoria</label>
                            <select class="form-select" id="categoriaProducto" name="categoria" required>
                                <option value="">Selecciona una categoria</option>
                                <option>Videojuegos</option>
                                <option>Consolas</option>
                                <option>Accesorios</option>
                                <option>Perifericos</option>
                                <option>PC Gaming</option>
                                <option>Merchandising</option>
                                <option>Regalos</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="imagenProducto">URL de la imagen</label>
                            <input class="form-control" id="imagenProducto" name="imagen" type="url" maxlength="2048" placeholder="https://ejemplo.com/producto.jpg" aria-describedby="ayudaImagen" required>
                            <div class="form-text" id="ayudaImagen">Pega el enlace directo a una imagen publica.</div>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" id="destacadoProducto" name="destacado" type="checkbox" value="1">
                                <label class="form-check-label" for="destacadoProducto">Destacado en la portada</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Guardar producto</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" href="index.html">Volver al panel</a>
            <a class="btn btn-primary d-none" id="verProducto">Ver producto creado</a>
        </div>
    </main>

    <footer class="pie-pagina py-3 text-center small">
        <div class="container">© 2026 VEXORA. Todos los derechos reservados.</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
